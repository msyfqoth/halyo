<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Contact — Halyo</title>
<style>
  body{background:#0a0e14;color:#c8d3e0;font-family:'Inter',system-ui,sans-serif;line-height:1.6;margin:0;padding:40px 20px}
  .wrap{max-width:560px;margin:0 auto}
  .brand{font-weight:800;font-size:26px;margin-bottom:6px}
  .brand span{color:#4ade80}
  h1{color:#e8eef5;font-size:26px;letter-spacing:-0.5px;margin:18px 0 6px}
  p.sub{color:#5c6a7e;font-size:14px;margin:0 0 28px}
  label{display:block;font-size:13px;color:#8b97a8;margin:18px 0 6px;letter-spacing:0.3px}
  input,textarea,select{width:100%;box-sizing:border-box;background:#0d131c;border:1px solid #1e2836;color:#c8d3e0;border-radius:8px;padding:12px 14px;font-size:15px;font-family:inherit}
  input:focus,textarea:focus,select:focus{outline:none;border-color:#4ade80}
  textarea{min-height:130px;resize:vertical}
  button{margin-top:24px;width:100%;background:#4ade80;color:#08120a;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
  .note{font-size:11px;color:#5c6a7e;margin-top:16px;line-height:1.6;font-family:'JetBrains Mono',monospace}
  a{color:#38bdf8}
  .back{display:inline-block;margin-top:26px;color:#5c6a7e;font-size:13px;text-decoration:none;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Hal<span>yo</span></div>
  <h1>Contact us</h1>
  <p class="sub">Lost your key, want a refund, or have a question? Send a message — we usually reply within a day.</p>

  <!-- Netlify Forms: the data-netlify attribute makes Netlify capture submissions.
       The hidden form-name input is required. A honeypot field reduces spam. -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/contact-success.html">
    <input type="hidden" name="form-name" value="contact" />
    <p style="display:none"><label>Don't fill this out: <input name="bot-field" /></label></p>

    <label for="name">Your name</label>
    <input id="name" type="text" name="name" required />

    <label for="email">Your email</label>
    <input id="email" type="email" name="email" required placeholder="so we can reply" />

    <label for="topic">What's this about?</label>
    <select id="topic" name="topic">
      <option>Lost my license key</option>
      <option>Refund request</option>
      <option>A question before buying</option>
      <option>Technical problem</option>
      <option>Something else</option>
    </select>

    <label for="order">Order / license key (if you have one)</label>
    <input id="order" type="text" name="order" placeholder="optional — helps us find your purchase" />

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit">Send message</button>
  </form>

  <div class="note">
    Prefer email? Write to <a href="mailto:support@halyoapp.com">support@halyoapp.com</a>.
  </div>

  <a class="back" href="/">← back to Halyo</a>
</div>
</body>
</html>
